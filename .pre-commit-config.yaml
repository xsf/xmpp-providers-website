default_language_version:
    python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--select, I, --fix]
      - id: ruff-format
      - id: ruff-check
  
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.97
    hooks:
      - id: ty

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
