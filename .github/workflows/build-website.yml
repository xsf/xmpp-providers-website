name: Website Build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Build website every day at 4:00 UTC
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHIVE: providers-xmpp-net-master.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python packages
        run: uv sync --locked

      - name: Prepare provider list
        run: uv run xmpp_providers_website prepare_website

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"

      - name: Build website
        run: hugo

      - name: Create build archive
        run: tar -czf ${{ env.ARCHIVE }} "./public"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: providers-xmpp-net-master
          path: ${{ env.ARCHIVE }}
